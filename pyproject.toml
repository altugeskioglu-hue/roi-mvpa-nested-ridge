[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "roi-mvpa"
version = "1.0.0"
description = "Leakage-controlled ROI-based multivoxel prediction for small-sample fMRI: nested-LOOCV Ridge, PCA-Ridge and full-pipeline permutation testing."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.6"
dependencies = ["numpy", "pandas", "nibabel"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["roi_mvpa"]
